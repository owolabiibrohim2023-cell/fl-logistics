<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>FAQ — FL Logistics</title>
<meta name="description" content="Answers about FL Logistics payment, delivery times, tracking, cash on delivery, prohibited items, interstate delivery and business pickups.">
<meta name="theme-color" content="#0B3D91">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230B3D91'/><text x='50' y='66' font-size='44' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'>FL</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="siteHeader"></div>
<main>
<section class="section" style="background:linear-gradient(135deg,var(--blue-dark),var(--blue));color:#fff;padding:44px 0">
  <div class="container text-center">
    <span class="kicker" style="background:rgba(255,255,255,.14);color:#ffd9ad">FAQ</span>
    <h1 style="color:#fff;font-size:2rem">Frequently asked questions</h1>
    <p style="color:#d7e5ff;margin-top:10px">Everything you need to know before you send. Still unsure? We reply fast on WhatsApp.</p>
  </div>
</section>

<section class="section"><div class="container" style="max-width:820px">
  <div class="field" style="margin-bottom:20px">
    <input id="faqSearch" placeholder="🔍 Search questions… e.g. payment, track, interstate" aria-label="Search frequently asked questions">
  </div>
  <div id="faqList"></div>
  <p class="text-center muted hidden" id="faqNone">No question matches your search. <a id="faqWa1" target="_blank" rel="noopener">Ask us on WhatsApp →</a></p>

  <div class="cta-banner" style="margin-top:30px">
    <h2>Still have a question?</h2>
    <p style="margin:8px auto 18px;max-width:460px">Chat with a real person — open daily until 6:00 PM.</p>
    <div class="btn-row" style="justify-content:center">
      <a class="btn btn-wa" id="faqWa" target="_blank" rel="noopener"><i class="fa-brands fa-whatsapp"></i> WhatsApp Us</a>
      <a class="btn btn-blue" href="tel:+2348137407197"><i class="fa-solid fa-phone"></i> 0813 740 7197</a>
    </div>
  </div>
</div></section>
</main>
<div id="siteFooter"></div>

<script type="module">
import { renderChrome, $, $$, waLink, esc } from "./app.js";
renderChrome("faq.html");
const wa = waLink("Hello FL Logistics, I have a question.");
$("#faqWa").href = wa; $("#faqWa1").href = wa;

const FAQS = [
  ["How do I pay?", `You book online first and get an instant estimate. We then confirm the <b>final price</b> with you on WhatsApp. After that you can pay by <b>bank transfer</b> (send the receipt in the chat), <b>cash on delivery</b>, or <b>pay on pickup</b>. There is no online card payment — see our <a href="payment.html">Payment Info page</a>.`],
  ["How long does delivery take?", `Within Lagos: <b>Same-day</b> for most bookings made early, <b>Express in 2–4 hours</b> for urgent items, and Standard by next working period. Interstate timelines depend on the city (e.g. Abuja, PH, Ibadan) and are confirmed with you on WhatsApp before payment. Traffic and weather can affect timing — we always keep you updated.`],
  ["What items can't be sent?", `For safety/legal reasons we cannot carry cash or jewellery, illegal drugs/contraband, weapons or explosives, flammable liquids/gases/chemicals, live animals, perishable food without cold packaging, or stolen/illegal goods. See the full list in our <a href="legal.html#shipping">Shipping &amp; Prohibited Items Policy</a>. Unsure? Ask us first.`],
  ["What if my package is delayed or damaged?", `Tell us immediately on WhatsApp with your Order ID. For delays, we'll trace the rider/route and update you honestly. For damage, please note it at delivery if possible and send photos within 24 hours — our <a href="legal.html#claims">Claims &amp; Refund Policy</a> explains how we investigate and resolve valid claims fairly. Proper packaging helps a lot; ask us for advice for fragile items.`],
  ["Do you deliver outside Lagos?", `Yes! We deliver interstate to major cities including Abuja, Ibadan, Port Harcourt, Enugu, Onitsha, Benin City, Kano, Kaduna, Ilorin, Akure and more. See <a href="pricing.html">Pricing &amp; Coverage</a> or ask about your exact city.`],
  ["Can I change the drop-off address after booking?", `Usually yes, if the rider hasn't completed delivery. Message us (or your rider directly from the tracking page) as early as possible with the new address. If the new address is much farther, the price difference will be confirmed with you first.`],
  ["How do I track my order?", `Go to <a href="track.html">Track Order</a> and enter your Order ID (e.g. FLG-4A8K2), or open the tracking link from your SMS/email/WhatsApp. You'll see live status, and while your parcel is in transit, your rider moving on a live map with Call/WhatsApp buttons. You can share the same link with your receiver.`],
  ["Do you offer cash on delivery?", `Yes — select <b>Cash on delivery</b> when booking and we'll agree it with you on WhatsApp. Tell your receiver the exact confirmed amount in advance. For some routes or high-value items we may ask for part-payment first.`],
  ["Can businesses get regular pickups?", `Absolutely — it's one of our strengths. Online vendors and SMEs get scheduled daily pickups, bulk multi-drop in one booking, and COD support. Create a free <b>Business account</b> on the <a href="signup.html">Sign Up page</a> and chat with us to arrange your routine.`],
  ["Do I need an account to book?", `No. Guests can book in 2 minutes and track with an Order ID. A free account simply keeps all your orders in one dashboard, saves your addresses, prefills future bookings and lets you reorder in one click.`],
  ["How do SMS and email alerts work?", `Automatically! When your order is placed, confirmed, paid, picked up, in transit, out for delivery, delivered or cancelled, we send updates to the sender email/phone provided (and the receiver's, if given). Signed-in customers can switch Email/SMS/WhatsApp alerts on or off anytime in <a href="account.html#profile">Profile Settings</a>. Keep your phone number in Nigerian format (0813… or +234…) so SMS arrives.`],
  ["Where is your office? Can I walk in?", `Yes, walk-ins are welcome at <b>Ste 48, Ogba Shopping Arcade (LSDPC), Ijaiye Road, Ogba, Lagos</b>. We're open daily until 6:00 PM. See the map and directions on our <a href="contact.html">Contact page</a>.`]
];

function renderFaqs(filter = "") {
  const q = filter.toLowerCase();
  const hits = FAQS.filter(([t, b]) => (t + " " + b).toLowerCase().includes(q));
  $("#faqNone").classList.toggle("hidden", hits.length > 0);
  $("#faqList").innerHTML = hits.map(([t, b]) => `
    <div class="faq-item"><button class="faq-q" type="button">${esc(t)}<i class="fa-solid fa-plus"></i></button>
    <div class="faq-a">${b}</div></div>`).join("");
  $$("#faqList .faq-q").forEach(btn => btn.addEventListener("click", () => {
    const item = btn.closest(".faq-item"), wasOpen = item.classList.contains("open");
    $$("#faqList .faq-item").forEach(i => i.classList.remove("open"));
    if (!wasOpen) item.classList.add("open");
  }));
}
renderFaqs();
$("#faqSearch").addEventListener("input", e => renderFaqs(e.target.value));
</script>
</body>
</html>
